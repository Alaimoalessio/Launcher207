plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}
android {
    namespace 'it.peugeot.launcher'
    compileSdk 35
    defaultConfig {
        applicationId 'it.peugeot.launcher'
        minSdk 23
        targetSdk 35
        versionCode 4
        versionName '0.1.3-demo'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions { jvmTarget = '1.8' }
    buildTypes {
        debug { debuggable false }
        release { minifyEnabled false }
    }
    testOptions {
        unitTests.includeAndroidResources = true
        unitTests.all {
            systemProperty 'robolectric.dependency.repo.url', 'https://repo.maven.apache.org/maven2'
        }
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.14.1'
    constraints {
        testImplementation('org.bouncycastle:bcprov-jdk18on:1.85') {
            because 'Corregge gli advisory OSV delle versioni transitive di Robolectric'
        }
        testImplementation('com.google.guava:guava:33.7.2-jre') {
            because 'Corregge GHSA-xxph-c9ww-hj94 nella dipendenza dei test'
        }
    }
}
